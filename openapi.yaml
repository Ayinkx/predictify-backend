openapi: 3.1.0
info:
  title: Predictify API
  version: 0.0.1
  description: Backend API for Predictify — a Stellar/Soroban prediction-markets dApp
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            requestId:
              type: string
          required:
            - code
      required:
        - error
    ValidationErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            details:
              nullable: true
          required:
            - code
      required:
        - error
    DependencyHealth:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - down
        correlationId:
          type: string
        checkedAt:
          type: string
          format: date-time
        dependencies:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum:
                  - ok
                  - degraded
                  - down
              latencyMs:
                type: number
              error:
                type: string
            required:
              - status
      required:
        - status
        - correlationId
        - checkedAt
        - dependencies
    ChallengeResponse:
      type: object
      properties:
        nonce:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - nonce
        - expiresAt
    ChallengeRequest:
      type: object
      properties:
        stellarAddress:
          type: string
      required:
        - stellarAddress
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      required:
        - accessToken
        - refreshToken
    VerifyRequest:
      type: object
      properties:
        stellarAddress:
          type: string
        nonce:
          type: string
        signature:
          type: string
      required:
        - stellarAddress
        - nonce
        - signature
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
        - refreshToken
    Market:
      type: object
      properties:
        id:
          type: string
        question:
          type: string
        status:
          type: string
        metadata:
          nullable: true
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - question
        - status
        - version
        - createdAt
    MarketSearchResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Market'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        page:
          type: integer
        fallback:
          type: boolean
        pagination:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            page:
              type: integer
            total:
              type: integer
            fallback:
              type: boolean
          required:
            - limit
            - offset
            - page
            - total
            - fallback
        meta:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            page:
              type: integer
            total:
              type: integer
            fallback:
              type: boolean
          required:
            - limit
            - offset
            - page
            - total
            - fallback
      required:
        - data
        - total
        - limit
        - offset
        - page
        - fallback
        - pagination
        - meta
    PatchMarketRequest:
      type: object
      properties:
        question:
          type: string
        metadata:
          nullable: true
        expectedVersion:
          type: integer
          minimum: 0
      required:
        - expectedVersion
    PredictionCountResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            marketId:
              type: string
            count:
              type: integer
              minimum: 0
            computedAt:
              type: string
              format: date-time
            cached:
              type: boolean
          required:
            - marketId
            - count
            - computedAt
            - cached
      required:
        - data
    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        stellarAddress:
          type: string
        score:
          type: number
      required:
        - rank
        - stellarAddress
        - score
    AnonRateLimitStatus:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
                - anonymous
            clientIp:
              type: string
            limit:
              type: integer
            used:
              type: integer
            remaining:
              type: integer
            windowMs:
              type: integer
            resetAt:
              type: string
              format: date-time
          required:
            - type
            - clientIp
            - limit
            - used
            - remaining
            - windowMs
            - resetAt
      required:
        - data
    AuthRateLimitStatus:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
                - authenticated
            limit:
              type: integer
            windowMs:
              type: integer
            bypasses:
              type: boolean
              enum:
                - true
          required:
            - type
            - limit
            - windowMs
            - bypasses
      required:
        - data
    FeaturedMarket:
      type: object
      properties:
        id:
          type: string
        question:
          type: string
        status:
          type: string
        resolutionOutcome:
          type: string
          nullable: true
        resolutionTime:
          type: string
          format: date-time
        winningOutcome:
          type: string
          nullable: true
        metadata:
          nullable: true
        featuredAt:
          type: string
          nullable: true
          format: date-time
        featuredBy:
          type: string
          nullable: true
      required:
        - id
        - question
        - status
        - resolutionTime
        - featuredAt
        - featuredBy
    FeatureMarketResponse:
      type: object
      properties:
        marketId:
          type: string
        featured:
          type: boolean
        featuredAt:
          type: string
          nullable: true
          format: date-time
        featuredBy:
          type: string
          nullable: true
        changed:
          type: boolean
      required:
        - marketId
        - featured
        - featuredAt
        - featuredBy
        - changed
    FeatureFlag:
      type: object
      properties:
        key:
          type: string
        enabled:
          type: boolean
        description:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
      required:
        - key
        - enabled
        - description
        - updatedAt
    FeatureFlagListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFlag'
      required:
        - data
    FeatureFlagResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FeatureFlag'
      required:
        - data
    CreateFeatureFlagRequest:
      type: object
      properties:
        key:
          type: string
        enabled:
          type: boolean
        description:
          type: string
          nullable: true
          maxLength: 280
      required:
        - key
        - enabled
    UpdateFeatureFlagRequest:
      type: object
      properties:
        enabled:
          type: boolean
        description:
          type: string
          nullable: true
          maxLength: 280
    NotificationCategory:
      type: string
      enum:
        - market_resolved
        - claim_ready
        - dispute_opened
    NotificationChannel:
      type: string
      enum:
        - email
        - webhook
    NotificationPreference:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/NotificationCategory'
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        enabled:
          type: boolean
      required:
        - category
        - channel
        - enabled
    NotificationPreferencesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            preferences:
              type: array
              items:
                $ref: '#/components/schemas/NotificationPreference'
          required:
            - preferences
      required:
        - data
    PatchNotificationPreferencesRequest:
      type: object
      properties:
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/NotificationPreference'
          minItems: 1
      required:
        - preferences
    MarkNotificationsReadResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            updatedCount:
              type: integer
              minimum: 0
          required:
            - updatedCount
      required:
        - data
    NotificationId:
      type: string
      format: uuid
    MarkNotificationsReadRequest:
      type: object
      properties:
        notificationIds:
          type: array
          items:
            $ref: '#/components/schemas/NotificationId'
        markAllAsRead:
          type: boolean
      additionalProperties: false
    CurrentUserProfile:
      type: object
      properties:
        stellarAddress:
          type: string
        createdAt:
          type: string
          format: date-time
        totals:
          type: object
          properties:
            prediction_count:
              type: integer
            claim_count:
              type: integer
          required:
            - prediction_count
            - claim_count
      required:
        - stellarAddress
        - createdAt
        - totals
    Prediction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        marketId:
          type: string
        status:
          type: string
          enum: &ref_0
            - pending
            - confirmed
            - won
            - lost
            - claimed
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - marketId
        - status
        - createdAt
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stellarAddress:
          type: string
        joinedAt:
          type: string
          format: date-time
        predictions:
          type: array
          items:
            $ref: '#/components/schemas/Prediction'
        totals:
          type: object
          properties:
            prediction_count:
              type: integer
            claim_count:
              type: integer
          required:
            - prediction_count
            - claim_count
      required:
        - id
        - stellarAddress
        - joinedAt
        - predictions
        - totals
    FollowResult:
      type: object
      properties:
        follower:
          type: string
        followee:
          type: string
        followedAt:
          type: string
          format: date-time
      required:
        - follower
        - followee
        - followedAt
    AdminUserView:
      type: object
      properties:
        user:
          type: object
          nullable: true
          properties:
            id:
              type: string
            stellarAddress:
              type: string
            createdAt:
              type: string
              format: date-time
          required:
            - id
            - stellarAddress
            - createdAt
        predictions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              marketId:
                type: string
              outcome:
                type: string
              amount:
                type: string
              createdAt:
                type: string
                format: date-time
            required:
              - id
              - marketId
              - outcome
              - amount
              - createdAt
        claims:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              marketId:
                type: string
              amount:
                type: string
              status:
                type: string
              createdAt:
                type: string
                format: date-time
            required:
              - id
              - marketId
              - amount
              - status
              - createdAt
        disputes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              marketId:
                type: string
              reason:
                type: string
              status:
                type: string
              createdAt:
                type: string
                format: date-time
            required:
              - id
              - marketId
              - reason
              - status
              - createdAt
        totals:
          type: object
          properties:
            predictions:
              type: integer
            claims:
              type: integer
            disputes:
              type: integer
          required:
            - predictions
            - claims
            - disputes
      required:
        - user
        - predictions
        - claims
        - disputes
        - totals
    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        actor:
          type: string
        targetAddress:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - action
        - createdAt
    PluginView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
        config:
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - enabled
        - createdAt
        - updatedAt
    CreatePluginRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties:
            nullable: true
      required:
        - name
    UpdatePluginRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 1000
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties:
            nullable: true
    DeletePluginResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name
    AdminRateLimitInspect:
      type: object
      properties:
        address:
          type: string
          description: Target Stellar address
        limit:
          type: integer
          description: Configured request cap in the window
        used:
          type: integer
          description: Requests currently active in the window
        remaining:
          type: integer
          description: Requests remaining in the current window
        windowMs:
          type: integer
          description: Sliding-window length in milliseconds
        resetAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp when the window resets
      required:
        - address
        - limit
        - used
        - remaining
        - windowMs
        - resetAt
    CheckStatus:
      type: string
      enum:
        - ok
        - degraded
        - error
    DbPoolStats:
      type: object
      properties:
        total:
          type: integer
          description: Total connections in pool
        idle:
          type: integer
          description: Idle (available) connections
        waiting:
          type: integer
          description: Clients waiting for a connection
      required:
        - total
        - idle
        - waiting
    DbPoolCheck:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CheckStatus'
        latencyMs:
          type: integer
        stats:
          $ref: '#/components/schemas/DbPoolStats'
        error:
          type: string
      required:
        - status
        - latencyMs
        - stats
    IndexerCheck:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CheckStatus'
        latencyMs:
          type: integer
        lastIndexedLedger:
          type: integer
          nullable: true
        chainTip:
          type: integer
          nullable: true
        lagLedgers:
          type: integer
          nullable: true
        error:
          type: string
      required:
        - status
        - latencyMs
        - lastIndexedLedger
        - chainTip
        - lagLedgers
    RpcCheck:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CheckStatus'
        latencyMs:
          type: integer
        latestLedger:
          type: integer
          nullable: true
        error:
          type: string
      required:
        - status
        - latencyMs
        - latestLedger
    AdminHealthDetail:
      type: object
      properties:
        dbPool:
          $ref: '#/components/schemas/DbPoolCheck'
        indexer:
          $ref: '#/components/schemas/IndexerCheck'
        rpc:
          $ref: '#/components/schemas/RpcCheck'
        checkedAt:
          type: string
          format: date-time
      required:
        - dbPool
        - indexer
        - rpc
        - checkedAt
  parameters: {}
paths:
  /health:
    get:
      operationId: healthCheck
      tags:
        - Health
      summary: Liveness check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
  /healthz/dependencies:
    get:
      operationId: healthDependencies
      tags:
        - Health
      summary: External dependency health probes
      responses:
        '200':
          description: All dependencies healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyHealth'
        '207':
          description: Some dependencies degraded
        '503':
          description: One or more dependencies down
  /metrics:
    get:
      operationId: getMetrics
      tags:
        - Monitoring
      summary: Prometheus metrics endpoint
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Prometheus text format metrics
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized (if METRICS_AUTH_TOKEN is set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/auth/challenge:
    post:
      operationId: authChallenge
      tags:
        - Auth
      summary: Request a sign-in challenge nonce
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
      responses:
        '201':
          description: Challenge issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorBody'
  /api/auth/verify:
    post:
      operationId: authVerify
      tags:
        - Auth
      summary: Verify challenge signature and obtain JWT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorBody'
        '401':
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/auth/refresh:
    post:
      operationId: authRefresh
      tags:
        - Auth
      summary: Rotate a refresh token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Reuse detected — family revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/auth/logout:
    post:
      operationId: authLogout
      tags:
        - Auth
      summary: Revoke the entire refresh-token family
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Logged out
        '400':
          description: Missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/markets/recommendations:
    get:
      operationId: getMarketRecommendations
      tags:
        - Markets
      summary: Get personalized market recommendations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of recommended markets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Market'
                required:
                  - data
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/markets:
    get:
      operationId: listMarkets
      tags:
        - Markets
      summary: List all markets
      responses:
        '200':
          description: Array of markets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Market'
                required:
                  - data
              examples:
                default:
                  value:
                    data:
                      - id: market-001
                        question: Will the US win the 2026 FIFA World Cup?
                        status: active
                        metadata:
                          category: sports
                          resolutionSource: official
                        version: 1
                        createdAt: '2026-01-10T12:00:00.000Z'
                      - id: market-002
                        question: Will Stellar launch a new protocol upgrade in 2026?
                        status: active
                        metadata:
                          category: technology
                          resolutionSource: community
                        version: 2
                        createdAt: '2026-02-14T07:30:00.000Z'
  /api/markets/search:
    get:
      operationId: searchMarkets
      tags:
        - Markets
      summary: Full-text search across markets
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: q
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type: integer
            nullable: true
            minimum: 0
            default: 0
          required: false
          name: offset
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
          required: false
          name: page
          in: query
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketSearchResult'
        '400':
          description: Missing query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/markets/tags:
    get:
      operationId: getMarketTags
      tags:
        - Markets
      summary: Get market tags with counts
      responses:
        '200':
          description: Market tags with counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        tag:
                          type: string
                        count:
                          type: number
                      required:
                        - tag
                        - count
                required:
                  - data
  /api/markets/{id}:
    get:
      operationId: getMarketById
      tags:
        - Markets
      summary: Get a market by ID
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        '200':
          description: Market
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Market'
                required:
                  - data
              examples:
                default:
                  value:
                    data:
                      id: market-001
                      question: Will the US win the 2026 FIFA World Cup?
                      status: active
                      metadata:
                        category: sports
                        resolutionSource: official
                      version: 1
                      createdAt: '2026-01-10T12:00:00.000Z'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    patch:
      operationId: updateMarket
      tags:
        - Markets
      summary: Update a market (admin only)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
