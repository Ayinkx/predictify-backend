openapi: 3.1.0
info:
  title: Predictify API
  version: 0.0.1
  description: Backend API for Predictify — a Stellar/Soroban prediction-markets dApp
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            requestId:
              type: string
          required:
            - code
      required:
        - error
    ValidationErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            details:
              nullable: true
          required:
            - code
      required:
        - error
    GlobalLeaderboardEntry:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          description: Internal user UUID
        stellar_address:
          type: string
          description: User's Stellar public key (G…)
        total_predictions:
          type: integer
          minimum: 0
          description: Total predictions placed across all markets
        correct_predictions:
          type: integer
          minimum: 0
          description: Predictions whose outcome matched the resolved market outcome
        accuracy_percentage:
          type: number
          minimum: 0
          maximum: 100
          description: Accuracy as a percentage (0–100), rounded to 2 d.p.
        total_markets:
          type: integer
          minimum: 0
          description: Number of distinct markets in which the user participated
        rank:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          description: 1-based global rank, ordered by accuracy DESC then total_predictions DESC
      required:
        - user_id
        - stellar_address
        - total_predictions
        - correct_predictions
        - accuracy_percentage
        - total_markets
        - rank
    DependencyHealth:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - down
        correlationId:
          type: string
        checkedAt:
          type: string
          format: date-time
        dependencies:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum:
                  - ok
                  - degraded
                  - down
              latencyMs:
                type: number
              error:
                type: string
            required:
              - status
      required:
        - status
        - correlationId
        - checkedAt
        - dependencies
    JwkKey:
      type: object
      properties:
        kid:
          type: string
        alg:
          type: string
          enum:
            - HS256
        kty:
          type: string
          enum:
            - oct
        use:
          type: string
          enum:
            - sig
      required:
        - kid
        - alg
        - kty
        - use
    JwksResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JwkKey'
      required:
        - keys
    ChallengeResponse:
      type: object
      properties:
        nonce:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - nonce
        - expiresAt
    ChallengeRequest:
      type: object
      properties:
        stellarAddress:
          type: string
      required:
        - stellarAddress
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      required:
        - accessToken
        - refreshToken
    VerifyRequest:
      type: object
      properties:
        stellarAddress:
          type: string
        nonce:
          type: string
        signature:
          type: string
      required:
        - stellarAddress
        - nonce
        - signature
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
        - refreshToken
    Market:
      type: object
      properties:
        id:
          type: string
        question:
          type: string
        status:
          type: string
        metadata:
          nullable: true
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - question
        - status
        - version
        - createdAt
    MarketSearchResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Market'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        page:
          type: integer
        fallback:
          type: boolean
        pagination:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            page:
              type: integer
            total:
              type: integer
            fallback:
              type: boolean
          required:
            - limit
            - offset
            - page
            - total
            - fallback
        meta:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            page:
              type: integer
            total:
              type: integer
            fallback:
              type: boolean
          required:
            - limit
            - offset
            - page
            - total
            - fallback
      required:
        - data
        - total
        - limit
        - offset
        - page
        - fallback
        - pagination
        - meta
    PatchMarketRequest:
      type: object
      properties:
        question:
          type: string
        metadata:
          nullable: true
        expectedVersion:
          type: integer
          minimum: 0
      required:
        - expectedVersion
    PredictionCountResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            marketId:
              type: string
            count:
              type: integer
              minimum: 0
            computedAt:
              type: string
              format: date-time
            cached:
              type: boolean
          required:
            - marketId
            - count
            - computedAt
            - cached
      required:
        - data
    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        stellarAddress:
          type: string
        score:
          type: number
      required:
        - rank
        - stellarAddress
        - score
    FeaturedMarket:
      type: object
      properties:
        id:
          type: string
        question:
          type: string
        status:
          type: string
        resolutionOutcome:
          type: string
          nullable: true
        resolutionTime:
          type: string
          format: date-time
        winningOutcome:
          type: string
          nullable: true
        metadata:
          nullable: true
        featuredAt:
          type: string
          nullable: true
          format: date-time
        featuredBy:
          type: string
          nullable: true
      required:
        - id
        - question
        - status
        - resolutionTime
        - featuredAt
        - featuredBy
    FeatureMarketResponse:
      type: object
      properties:
        marketId:
          type: string
        featured:
          type: boolean
        featuredAt:
          type: string
          nullable: true
          format: date-time
        featuredBy:
          type: string
          nullable: true
        changed:
          type: boolean
      required:
        - marketId
        - featured
        - featuredAt
        - featuredBy
        - changed
    NotificationCategory:
      type: string
      enum:
        - market_resolved
        - claim_ready
        - dispute_opened
    NotificationChannel:
      type: string
      enum:
        - email
        - webhook
    NotificationPreference:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/NotificationCategory'
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        enabled:
          type: boolean
      required:
        - category
        - channel
        - enabled
    NotificationPreferencesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            preferences:
              type: array
              items:
                $ref: '#/components/schemas/NotificationPreference'
          required:
            - preferences
      required:
        - data
    PatchNotificationPreferencesRequest:
      type: object
      properties:
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/NotificationPreference'
          minItems: 1
      required:
        - preferences
    MarkNotificationsReadResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            updatedCount:
              type: integer
              minimum: 0
          required:
            - updatedCount
      required:
        - data
    NotificationId:
      type: string
      format: uuid
    MarkNotificationsReadRequest:
      type: object
      properties:
        notificationIds:
          type: array
          items:
            $ref: '#/components/schemas/NotificationId'
        markAllAsRead:
          type: boolean
      additionalProperties: false
    CurrentUserProfile:
      type: object
      properties:
        stellarAddress:
          type: string
        createdAt:
          type: string
          format: date-time
        totals:
          type: object
          properties:
            prediction_count:
              type: integer
            claim_count:
              type: integer
          required:
            - prediction_count
            - claim_count
      required:
        - stellarAddress
        - createdAt
        - totals
      example:
        stellarAddress: "GCM3Z6Z5L6Z4X6Z5L6Z4X6Z5L6Z4X6Z5L6Z4X6Z5L6Z4X6Z5L6Z4X6Z5"
        createdAt: "2023-10-01T12:00:00Z"
        totals:
          prediction_count: 5
          claim_count: 2
    Prediction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        marketId:
          type: string
        status:
          type: string
          enum: &ref_0
            - pending
            - confirmed
            - won
            - lost
            - claimed
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - marketId
        - status
        - createdAt
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stellarAddress:
          type: string
        joinedAt:
          type: string
          format: date-time
        predictions:
          type: array
          items:
            $ref: '#/components/schemas/Prediction'
        totals:
          type: object
          properties:
            prediction_count:
              type: integer
            claim_count:
              type: integer
          required:
            - prediction_count
            - claim_count
      required:
        - id
        - stellarAddress
        - joinedAt
        - predictions
        - totals
      example:
        id: "123e4567-e89b-12d3-a456-426614174000"
        stellarAddress: "GCM3Z6Z5L6Z4X6Z5L6Z4X6Z5L6Z4X6Z5L6Z4X6Z5L6Z4X6Z5L6Z4X6Z5"
        joinedAt: "2023-10-01T12:00:00Z"
        predictions:
          - id: "223e4567-e89b-12d3-a456-426614174001"
            marketId: "market-123"
            status: "won"
            createdAt: "2023-10-02T12:00:00Z"
        totals:
          prediction_count: 1
          claim_count: 0
    PredictionRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        marketId:
          type: string
        question:
          type: string
        outcome:
          type: string
        amount:
          type: string
        txHash:
          type: string
        status:
          type: string
          enum: *ref_0
        result:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        resolutionTime:
          type: string
          format: date-time
      required:
        - id
        - marketId
        - question
        - outcome
        - amount
        - txHash
        - status
        - result
        - createdAt
        - resolutionTime
    PredictionsListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PredictionRow'
        nextCursor:
          type: string
          nullable: true
      required:
        - data
        - nextCursor
    FollowResult:
      type: object
      properties:
        follower:
          type: string
        followee:
          type: string
        followedAt:
          type: string
          format: date-time
      required:
        - follower
        - followee
        - followedAt
    AdminUserView:
      type: object
      properties:
        user:
          type: object
          nullable: true
          properties:
            id:
              type: string
            stellarAddress:
              type: string
            createdAt:
              type: string
              format: date-time
          required:
            - id
            - stellarAddress
            - createdAt
        predictions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              marketId:
                type: string
              outcome:
                type: string
              amount:
                type: string
              createdAt:
                type: string
                format: date-time
            required:
              - id
              - marketId
              - outcome
              - amount
              - createdAt
        claims:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              marketId:
                type: string
              amount:
                type: string
              status:
                type: string
              createdAt:
                type: string
                format: date-time
            required:
              - id
              - marketId
              - amount
              - status
              - createdAt
        disputes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              marketId:
                type: string
              reason:
                type: string
              status:
                type: string
              createdAt:
                type: string
                format: date-time
            required:
              - id
              - marketId
              - reason
              - status
              - createdAt
        totals:
          type: object
          properties:
            predictions:
              type: integer
            claims:
              type: integer
            disputes:
              type: integer
          required:
            - predictions
            - claims
            - disputes
      required:
        - user
        - predictions
        - claims
        - disputes
        - totals
      example:
        user:
          id: "123e4567-e89b-12d3-a456-426614174000"
          stellarAddress: "GCM3Z6Z5L6Z4X6Z5L6Z4X6Z5L6Z4X6Z5L6Z4X6Z5L6Z4X6Z5L6Z4X6Z5"
          createdAt: "2023-10-01T12:00:00Z"
        predictions:
          - id: "223e4567-e89b-12d3-a456-426614174001"
            marketId: "market-123"
            outcome: "Yes"
            amount: "100.00"
            createdAt: "2023-10-02T12:00:00Z"
        claims:
          - id: "333e4567-e89b-12d3-a456-426614174002"
            marketId: "market-123"
            amount: "150.00"
            status: "processed"
            createdAt: "2023-10-05T12:00:00Z"
        disputes:
          - id: "444e4567-e89b-12d3-a456-426614174003"
            marketId: "market-123"
            reason: "Invalid outcome"
            status: "resolved"
            createdAt: "2023-10-06T12:00:00Z"
        totals:
          predictions: 1
          claims: 1
          disputes: 1
    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        actor:
          type: string
        targetAddress:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - action
        - createdAt
    CheckStatus:
      type: string
      enum:
        - ok
        - degraded
        - error
    DbPoolStats:
      type: object
      properties:
        total:
          type: integer
          description: Total connections in pool
        idle:
          type: integer
          description: Idle (available) connections
        waiting:
          type: integer
          description: Clients waiting for a connection
      required:
        - total
        - idle
        - waiting
    DbPoolCheck:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CheckStatus'
        latencyMs:
          type: integer
        stats:
          $ref: '#/components/schemas/DbPoolStats'
        error:
          type: string
      required:
        - status
        - latencyMs
        - stats
    IndexerCheck:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CheckStatus'
        latencyMs:
          type: integer
        lastIndexedLedger:
          type: integer
          nullable: true
        chainTip:
          type: integer
          nullable: true
        lagLedgers:
          type: integer
          nullable: true
        error:
          type: string
      required:
        - status
        - latencyMs
        - lastIndexedLedger
        - chainTip
        - lagLedgers
    RpcCheck:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CheckStatus'
        latencyMs:
          type: integer
        latestLedger:
          type: integer
          nullable: true
        error:
          type: string
      required:
        - status
        - latencyMs
        - latestLedger
    AdminHealthDetail:
      type: object
      properties:
        dbPool:
          $ref: '#/components/schemas/DbPoolCheck'
        indexer:
          $ref: '#/components/schemas/IndexerCheck'
        rpc:
          $ref: '#/components/schemas/RpcCheck'
        checkedAt:
          type: string
          format: date-time
      required:
        - dbPool
        - indexer
        - rpc
        - checkedAt
  parameters: {}
paths:
  /health:
    get:
      operationId: healthCheck
      tags:
        - Health
      summary: Liveness check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
  /healthz/dependencies:
    get:
      operationId: healthDependencies
      tags:
        - Health
      summary: External dependency health probes
      responses:
        '200':
          description: All dependencies healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyHealth'
        '207':
          description: Some dependencies degraded
        '503':
          description: One or more dependencies down
  /api/users/health:
    get:
      operationId: usersHealth
      tags:
        - Health
      summary: User-facing dependency health probe
      responses:
        '200':
          description: User service dependencies are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersHealthResponse'
        '503':
          description: User service dependency probe failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersHealthResponse'
  /metrics:
    get:
      operationId: getMetrics
      tags:
        - Monitoring
      summary: Prometheus metrics endpoint
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Prometheus text format metrics
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized (if METRICS_AUTH_TOKEN is set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      tags:
        - JWKS
      summary: JSON Web Key Set endpoint
      description: >-
        Returns the JSON Web Key Set containing metadata for all available JWT signing keys. Follows RFC 7517 (JWK) and
        RFC 7513 (JWKS) where applicable, adapted for HMAC-based signing (HS256). The actual secret values are never
        exposed - only key metadata is returned.
      responses:
        '200':
          description: JWKS response with key metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
  /api/auth/challenge:
    post:
      operationId: authChallenge
      tags:
        - Auth
      summary: Request a sign-in challenge nonce
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
            examples:
              challengeRequest:
                value:
                  stellarAddress: GABC1234567890DEFGHIJKLMNOPQRSTUVWX
      responses:
        '201':
          description: Challenge issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
              examples:
                challengeIssued:
                  value:
                    nonce: challenge-nonce-001
                    expiresAt: '2026-07-25T12:00:00.000Z'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorBody'
  /api/auth/verify:
    post:
      operationId: authVerify
      tags:
        - Auth
      summary: Verify challenge signature and obtain JWT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
            examples:
              verifyRequest:
                value:
                  stellarAddress: GABC1234567890DEFGHIJKLMNOPQRSTUVWX
                  nonce: challenge-nonce-001
                  signature: ed25519-signature-hex
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              examples:
                tokensIssued:
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJnb29nbGUtdXNlcjEifQ.signature
                    refreshToken: refresh-token-001
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorBody'
        '401':
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/auth/refresh:
    post:
      operationId: authRefresh
      tags:
        - Auth
      summary: Rotate a refresh token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              refreshTokenRequest:
                value:
                  refreshToken: refresh-token-001
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              examples:
                refreshedTokens:
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJnb29nbGUtdXNlcjEifQ.signature
                    refreshToken: refresh-token-002
        '400':
          description: Missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Reuse detected — family revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/auth/logout:
    post:
      operationId: authLogout
      tags:
        - Auth
      summary: Revoke the entire refresh-token family
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              logoutRequest:
                value:
                  refreshToken: refresh-token-001
      responses:
        '204':
          description: Logged out
        '400':
          description: Missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/markets/recommendations:
    get:
      tags:
        - Markets
      summary: Get personalized market recommendations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of recommended markets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Market'
                required:
                  - data
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/markets:
    get:
      operationId: getMarketRecommendations
      tags:
        - Markets
      summary: Get personalized market recommendations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of recommended markets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Market'
                required:
                  - data
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/markets:
    get:
      operationId: listMarkets
      tags:
        - Markets
      summary: List markets with cursor pagination
      parameters:
        - schema:
            type: integer
            minimum: 1
